<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="gcashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005CE6"/>
      <stop offset="100%" stop-color="#007DFE"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="500" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Header Bar with GCash Blue -->
  <path d="M 0 24 Q 0 0 24 0 L 376 0 Q 400 0 400 24 L 400 88 L 0 88 Z" fill="url(#gcashGrad)"/>
  
  <!-- GCash Logo / Brand Header -->
  <g transform="translate(24, 26)">
    <!-- Signal Wave GCash Icon -->
    <circle cx="20" cy="20" r="16" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="10" fill="#005CE6"/>
    <circle cx="20" cy="20" r="5" fill="#FFFFFF"/>
    <path d="M 28 14 A 12 12 0 0 1 28 26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 33 10 A 18 18 0 0 1 33 30" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <text x="44" y="27" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">GCash</text>
    <text x="352" y="26" text-anchor="end" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="2" opacity="0.9">OFFICIAL QR</text>
  </g>

  <!-- Merchant Identifier Banner -->
  <rect x="24" y="102" width="352" height="48" rx="10" fill="#F4F4F6"/>
  <text x="40" y="126" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#71717A" letter-spacing="1.5">MERCHANT NAME</text>
  <text x="40" y="142" font-family="'Geist', system-ui, sans-serif" font-size="15" font-weight="800" fill="#09090B">1968 CLOTHING PH</text>
  <text x="360" y="134" text-anchor="end" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#005CE6">0917 196 8000</text>

  <!-- QR Code Frame -->
  <rect x="50" y="166" width="300" height="300" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2"/>
  
  <!-- Outer Corner Positioning Squares -->
  <!-- Top Left -->
  <rect x="74" y="190" width="56" height="56" rx="10" fill="#09090B"/>
  <rect x="84" y="200" width="36" height="36" rx="6" fill="#FFFFFF"/>
  <rect x="92" y="208" width="20" height="20" rx="3" fill="#005CE6"/>

  <!-- Top Right -->
  <rect x="270" y="190" width="56" height="56" rx="10" fill="#09090B"/>
  <rect x="280" y="200" width="36" height="36" rx="6" fill="#FFFFFF"/>
  <rect x="288" y="208" width="20" height="20" rx="3" fill="#005CE6"/>

  <!-- Bottom Left -->
  <rect x="74" y="386" width="56" height="56" rx="10" fill="#09090B"/>
  <rect x="84" y="396" width="36" height="36" rx="6" fill="#FFFFFF"/>
  <rect x="92" y="404" width="20" height="20" rx="3" fill="#005CE6"/>

  <!-- QR Matrix Code Grid Simulation -->
  <g fill="#18181B">
    <!-- Timing Patterns -->
    <rect x="140" y="212" width="10" height="10" rx="2"/>
    <rect x="160" y="212" width="10" height="10" rx="2"/>
    <rect x="180" y="212" width="10" height="10" rx="2"/>
    <rect x="200" y="212" width="10" height="10" rx="2"/>
    <rect x="220" y="212" width="10" height="10" rx="2"/>
    <rect x="240" y="212" width="10" height="10" rx="2"/>
    
    <rect x="98" y="256" width="10" height="10" rx="2"/>
    <rect x="98" y="276" width="10" height="10" rx="2"/>
    <rect x="98" y="296" width="10" height="10" rx="2"/>
    <rect x="98" y="316" width="10" height="10" rx="2"/>
    <rect x="98" y="336" width="10" height="10" rx="2"/>
    <rect x="98" y="356" width="10" height="10" rx="2"/>

    <!-- Data Blocks Row 1 -->
    <rect x="140" y="190" width="10" height="10" rx="2"/><rect x="155" y="190" width="10" height="10" rx="2"/>
    <rect x="185" y="190" width="25" height="10" rx="2"/><rect x="230" y="190" width="10" height="10" rx="2"/>

    <!-- Data Blocks Row 2 -->
    <rect x="140" y="235" width="25" height="10" rx="2"/><rect x="180" y="235" width="10" height="10" rx="2"/>
    <rect x="210" y="235" width="30" height="10" rx="2"/><rect x="255" y="235" width="10" height="10" rx="2"/>

    <!-- Data Blocks Row 3 -->
    <rect x="74" y="256" width="15" height="10" rx="2"/><rect x="120" y="256" width="30" height="10" rx="2"/>
    <rect x="165" y="256" width="10" height="10" rx="2"/><rect x="210" y="256" width="15" height="10" rx="2"/>
    <rect x="240" y="256" width="25" height="10" rx="2"/><rect x="280" y="256" width="46" height="10" rx="2"/>

    <!-- Center Data Matrix -->
    <rect x="135" y="275" width="20" height="10" rx="2"/><rect x="170" y="275" width="10" height="10" rx="2"/>
    <rect x="195" y="275" width="25" height="10" rx="2"/><rect x="235" y="275" width="20" height="10" rx="2"/>
    <rect x="270" y="275" width="15" height="10" rx="2"/><rect x="300" y="275" width="26" height="10" rx="2"/>

    <rect x="74" y="295" width="15" height="10" rx="2"/><rect x="120" y="295" width="15" height="10" rx="2"/>
    <rect x="150" y="295" width="30" height="10" rx="2"/><rect x="245" y="295" width="25" height="10" rx="2"/>
    <rect x="285" y="295" width="15" height="10" rx="2"/><rect x="310" y="295" width="16" height="10" rx="2"/>

    <!-- Center Brand Emblem in QR -->
    <g transform="translate(178, 298)">
      <rect width="44" height="44" rx="8" fill="#FFFFFF" stroke="#005CE6" stroke-width="2.5"/>
      <text x="22" y="28" text-anchor="middle" font-family="'Geist', sans-serif" font-size="14" font-weight="900" fill="#005CE6">1968</text>
    </g>

    <!-- Lower Data Blocks -->
    <rect x="120" y="325" width="20" height="10" rx="2"/><rect x="150" y="325" width="15" height="10" rx="2"/>
    <rect x="235" y="325" width="25" height="10" rx="2"/><rect x="275" y="325" width="20" height="10" rx="2"/>
    <rect x="305" y="325" width="21" height="10" rx="2"/>

    <rect x="74" y="345" width="15" height="10" rx="2"/><rect x="120" y="345" width="35" height="10" rx="2"/>
    <rect x="170" y="345" width="25" height="10" rx="2"/><rect x="210" y="345" width="30" height="10" rx="2"/>
    <rect x="255" y="345" width="35" height="10" rx="2"/><rect x="305" y="345" width="21" height="10" rx="2"/>

    <rect x="140" y="365" width="25" height="10" rx="2"/><rect x="180" y="365" width="15" height="10" rx="2"/>
    <rect x="210" y="365" width="20" height="10" rx="2"/><rect x="245" y="365" width="35" height="10" rx="2"/>
    <rect x="295" y="365" width="31" height="10" rx="2"/>

    <!-- Bottom Right Cluster -->
    <rect x="140" y="390" width="15" height="10" rx="2"/><rect x="170" y="390" width="30" height="10" rx="2"/>
    <rect x="215" y="390" width="20" height="10" rx="2"/><rect x="250" y="390" width="25" height="10" rx="2"/>
    <rect x="290" y="390" width="36" height="10" rx="2"/>

    <rect x="140" y="415" width="35" height="10" rx="2"/><rect x="190" y="415" width="20" height="10" rx="2"/>
    <rect x="225" y="415" width="35" height="10" rx="2"/><rect x="275" y="415" width="20" height="10" rx="2"/>
    <rect x="305" y="415" width="21" height="10" rx="2"/>

    <rect x="140" y="435" width="20" height="10" rx="2"/><rect x="175" y="435" width="25" height="10" rx="2"/>
    <rect x="215" y="435" width="30" height="10" rx="2"/><rect x="260" y="435" width="40" height="10" rx="2"/>
    <rect x="310" y="435" width="16" height="10" rx="2"/>
  </g>

  <!-- Bottom CTA Tagline -->
  <rect x="0" y="475" width="400" height="25" fill="#FAFAFA" rx="0"/>
  <text x="200" y="492" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#71717A" letter-spacing="1">SCAN WITH GCASH APP TO PAY</text>
</svg>
